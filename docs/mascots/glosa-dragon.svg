<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Glosa, a friendly baby dragon">
  <defs>
    <radialGradient id="gb" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></radialGradient>
  </defs>
  <g stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M148 154 C190 154 196 112 176 102 C184 126 166 138 146 134 Z" fill="url(#gb)"/>
    <path d="M176 102 l14 -10 l-2 16 z" fill="#facc15" stroke="#a16207"/>
    <!-- wings -->
    <path d="M56 98 C20 70 14 108 28 124 C36 110 46 110 58 114 Z" fill="#93c5fd"/>
    <path d="M144 98 C180 70 186 108 172 124 C164 110 154 110 142 114 Z" fill="#93c5fd"/>
    <!-- body -->
    <ellipse cx="100" cy="136" rx="48" ry="42" fill="url(#gb)"/>
    <ellipse cx="100" cy="146" rx="30" ry="27" fill="#dbeafe" stroke="none"/>
    <!-- feet -->
    <ellipse cx="75" cy="176" rx="15" ry="8" fill="#1d4ed8"/>
    <ellipse cx="125" cy="176" rx="15" ry="8" fill="#1d4ed8"/>
    <!-- horns -->
    <path d="M68 46 L56 12 L84 38 Z" fill="#fde047" stroke="#a16207"/>
    <path d="M132 46 L144 12 L116 38 Z" fill="#fde047" stroke="#a16207"/>
    <!-- head -->
    <circle cx="100" cy="76" r="43" fill="url(#gb)"/>
    <!-- cheeks -->
    <circle cx="68" cy="92" r="8" fill="#f472b6" stroke="none" opacity="0.7"/>
    <circle cx="132" cy="92" r="8" fill="#f472b6" stroke="none" opacity="0.7"/>
    <!-- eyes -->
    <ellipse cx="82" cy="74" rx="11" ry="13" fill="#0f172a" stroke="none"/>
    <ellipse cx="118" cy="74" rx="11" ry="13" fill="#0f172a" stroke="none"/>
    <circle cx="85" cy="69" r="5" fill="#fff" stroke="none"/>
    <circle cx="121" cy="69" r="5" fill="#fff" stroke="none"/>
    <circle cx="79" cy="79" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="115" cy="79" r="2.2" fill="#fff" stroke="none"/>
    <!-- nostrils and smile -->
    <circle cx="94" cy="90" r="1.8" fill="#1e3a8a" stroke="none"/>
    <circle cx="106" cy="90" r="1.8" fill="#1e3a8a" stroke="none"/>
    <path d="M88 99 Q100 110 112 99" fill="none" stroke="#0f172a" stroke-width="3"/>
  </g>
</svg>

