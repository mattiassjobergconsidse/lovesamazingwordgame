Let<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mascot suggestions</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #f8fafc;
      }
      main {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
        padding: 1rem;
        background: #fff;
        border-radius: 1.5rem;
        text-align: center;
      }
      figure.dark {
        background: #1e293b;
        color: #fff;
      }
      img {
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <h1>Mascot suggestions (light and dark background)</h1>
    <main>
      <figure>
        <img src="glosa-dragon.svg" alt="Glosa" />
        <figcaption>A: Glosa (dragon)</figcaption>
      </figure>
      <figure>
        <img src="foxel-fox.svg" alt="Foxel" />
        <figcaption>B: Foxel (fox)</figcaption>
      </figure>
      <figure>
        <img src="bubo-owl.svg" alt="Bubo" />
        <figcaption>C: Bubo (owl)</figcaption>
      </figure>
      <figure class="dark">
        <img src="glosa-dragon.svg" alt="Glosa" />
        <figcaption>A: Glosa</figcaption>
      </figure>
      <figure class="dark">
        <img src="foxel-fox.svg" alt="Foxel" />
        <figcaption>B: Foxel</figcaption>
      </figure>
      <figure class="dark">
        <img src="bubo-owl.svg" alt="Bubo" />
        <figcaption>C: Bubo</figcaption>
      </figure>
    </main>
    <h2>Fierce</h2>
    <main>
      <figure>
        <img src="blaze-drake.svg" alt="Blaze" />
        <figcaption>D: Blaze (fire drake)</figcaption>
      </figure>
      <figure>
        <img src="umbra-wolf.svg" alt="Umbra" />
        <figcaption>E: Umbra (shadow wolf)</figcaption>
      </figure>
      <figure>
        <img src="volt-thunder.svg" alt="Volt" />
        <figcaption>F: Volt (thunder beast)</figcaption>
      </figure>
      <figure class="dark">
        <img src="blaze-drake.svg" alt="Blaze" />
        <figcaption>D: Blaze</figcaption>
      </figure>
      <figure class="dark">
        <img src="umbra-wolf.svg" alt="Umbra" />
        <figcaption>E: Umbra</figcaption>
      </figure>
      <figure class="dark">
        <img src="volt-thunder.svg" alt="Volt" />
        <figcaption>F: Volt</figcaption>
      </figure>
    </main>
  </body>
</html>
