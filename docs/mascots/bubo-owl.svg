<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bubo, a clever owl with glasses">
  <defs>
    <radialGradient id="ob" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></radialGradient>
  </defs>
  <g stroke="#4c1d95" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ear tufts -->
    <path d="M44 62 L40 20 L84 48 Z" fill="url(#ob)"/>
    <path d="M156 62 L160 20 L116 48 Z" fill="url(#ob)"/>
    <!-- body -->
    <ellipse cx="100" cy="118" rx="58" ry="66" fill="url(#ob)"/>
    <!-- wings -->
    <path d="M46 98 C26 120 30 156 52 164 C60 146 60 122 52 100 Z" fill="#6d28d9"/>
    <path d="M154 98 C174 120 170 156 148 164 C140 146 140 122 148 100 Z" fill="#6d28d9"/>
    <!-- belly -->
    <ellipse cx="100" cy="138" rx="34" ry="40" fill="#ede9fe" stroke="none"/>
    <path d="M80 126 Q86 132 92 126 M96 126 Q102 132 108 126 M112 126 Q118 132 124 126 M84 142 Q90 148 96 142 M104 142 Q110 148 116 142 M88 158 Q94 164 100 158 M100 158 Q106 164 112 158" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
    <!-- feet -->
    <path d="M76 180 h14 M110 180 h14" stroke="#ea580c" stroke-width="7"/>
    <!-- glasses -->
    <circle cx="76" cy="86" r="25" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="124" cy="86" r="25" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
    <!-- eyes -->
    <circle cx="78" cy="88" r="13" fill="#0f172a" stroke="none"/>
    <circle cx="122" cy="88" r="13" fill="#0f172a" stroke="none"/>
    <circle cx="82" cy="83" r="5" fill="#fff" stroke="none"/>
    <circle cx="126" cy="83" r="5" fill="#fff" stroke="none"/>
    <circle cx="73" cy="94" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="117" cy="94" r="2.2" fill="#fff" stroke="none"/>
    <!-- beak -->
    <path d="M91 106 L109 106 L100 124 Z" fill="#fb923c" stroke="#9a3412"/>
  </g>
</svg>

