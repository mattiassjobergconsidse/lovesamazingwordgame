<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Umbra, a shadow wolf pup">
  <defs>
    <radialGradient id="ub" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></radialGradient>
  </defs>
  <g stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
