    <path d="M44 76 L42 18 L92 50 Z" fill="url(#ub)"/>
    <path d="M156 76 L158 18 L108 50 Z" fill="url(#ub)"/>
    <path d="M54 56 L52 34 L74 48 Z" fill="#7c3aed" stroke="none"/>
    <path d="M146 56 L148 34 L126 48 Z" fill="#7c3aed" stroke="none"/>
    <!-- head with cheek fur -->
    <path d="M36 92 C36 46 164 46 164 92 L172 112 L150 108 L156 126 L132 124 C122 132 78 132 68 124 L44 126 L50 108 L28 112 Z" fill="url(#ub)"/>
