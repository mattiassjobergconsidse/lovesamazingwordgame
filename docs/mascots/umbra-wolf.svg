    <ellipse cx="100" cy="148" rx="38" ry="35" fill="url(#ub)"/>
    <ellipse cx="100" cy="156" rx="22" ry="23" fill="#e2e8f0" stroke="none"/>
    <ellipse cx="80" cy="182" rx="13" ry="8" fill="#1e293b"/>
