    <path d="M104 56 A12 12 0 1 0 104 78 A9 9 0 1 1 104 56 Z" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
    <!-- eyes -->
    <ellipse cx="74" cy="88" rx="11" ry="13" fill="#0f172a" stroke="none"/>
    <ellipse cx="126" cy="88" rx="11" ry="13" fill="#0f172a" stroke="none"/>
    <ellipse cx="74" cy="89" rx="8" ry="10" fill="#22d3ee" stroke="none"/>
    <ellipse cx="126" cy="89" rx="8" ry="10" fill="#22d3ee" stroke="none"/>
    <circle cx="77" cy="83" r="4.5" fill="#fff" stroke="none"/>
    <circle cx="129" cy="83" r="4.5" fill="#fff" stroke="none"/>
    <circle cx="71" cy="94" r="2" fill="#fff" stroke="none"/>
    <circle cx="123" cy="94" r="2" fill="#fff" stroke="none"/>
