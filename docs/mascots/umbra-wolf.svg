    <path d="M140 160 C198 170 204 98 166 86 C176 120 154 132 132 136 Z" fill="url(#ub)"/>
    <path d="M166 86 C184 90 196 106 190 122 C184 110 176 104 164 104 Z" fill="#a78bfa" stroke="#4c1d95"/>
